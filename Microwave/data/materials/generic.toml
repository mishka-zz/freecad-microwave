# The catalog that ships with the workbench.
#
# Data, not code: this file is read with tomllib and nothing in it is executed.
# Copy it next to your own catalogs to use it as a starting point - change the
# [catalog] id if you do, or the copy will refuse to load beside this one.
#
# Nominal values for a first pass. For a board you will build, use the values
# of its laminate from the fabricator who makes it.

schema = 1

[catalog]
id = "generic"
name = "Generic"
version = "2026-07-30"
description = "Common substrates and conductors at nominal values, for a first pass. For a board you build, use the fabricator's datasheet."

# --- substrates -------------------------------------------------------------

[[material]]
id = "air"
name = "Air"
kind = "dielectric"
epsilon_r = 1.0
color = "#E6E6FF"
description = "Vacuum / air reference."

[[material]]
id = "fr4"
name = "FR4"
kind = "dielectric"
epsilon_r = 4.3
loss_tangent = 0.025
measured_at = 1.0e9
color = "#218B22"
description = "Nominal epoxy-glass laminate. Permittivity varies from about 4.1 to 4.7 with weave and resin content, and falls with frequency."

[[material]]
id = "pvc"
name = "PVC"
kind = "dielectric"
epsilon_r = 2.9
loss_tangent = 0.008
measured_at = 1.0e6
color = "#D8D8C0"
description = "Rigid polyvinyl chloride, for enclosures and cable jackets. Its values above a few hundred MHz are poorly known."

[[material]]
id = "ptfe"
name = "PTFE"
kind = "dielectric"
epsilon_r = 2.1
loss_tangent = 0.0002
measured_at = 1.0e10
color = "#FFFFFF"
description = "Unfilled polytetrafluoroethylene (Teflon)."

[[material]]
id = "alumina-996"
name = "Alumina 99.6%"
kind = "dielectric"
epsilon_r = 9.8
loss_tangent = 0.0001
measured_at = 1.0e10
color = "#E6E6E6"
description = "99.6% Al2O3 ceramic substrate."

# --- conductors -------------------------------------------------------------
#
# Each conductor here with a conductivity is a sheet: bind it to a flat face.
# Its thickness sets the loss and is not drawn. Bound to a shape with thickness
# it is refused, since openEMS would solve that shape as a perfect conductor.
# For a solid conductor - a machined wall, a curved foil - use a perfect-conductor
# entry at the end, and read the result as lossless.

[[material]]
id = "copper"
name = "Copper, 1 oz"
kind = "conducting_sheet"
conductivity = 5.8e7
thickness = 0.035
color = "#B87333"
description = "Annealed copper foil."

[[material]]
id = "copper-half-oz"
name = "Copper, 0.5 oz"
kind = "conducting_sheet"
conductivity = 5.8e7
thickness = 0.018
color = "#B87333"
description = "Annealed copper foil, the usual inner-layer weight."

[[material]]
id = "brass"
name = "Brass"
kind = "conducting_sheet"
conductivity = 1.57e7
thickness = 0.5
color = "#C8A951"
description = "CuZn37. Waveguide and enclosure walls, drawn as faces."

[[material]]
id = "aluminium"
name = "Aluminium 6061"
kind = "conducting_sheet"
conductivity = 2.5e7
thickness = 1.0
color = "#A8A8A8"
description = "Enclosures and machined cavities, drawn as faces."

[[material]]
id = "copper-pec"
name = "Copper (perfect)"
kind = "pec"
color = "#B87333"
description = "Lossless idealisation of copper."

[[material]]
id = "aluminium-pec"
name = "Aluminium (perfect)"
kind = "pec"
color = "#A8A8A8"
description = "Lossless idealisation of aluminium."
