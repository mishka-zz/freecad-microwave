# The catalog that ships with the workbench.
#
# Data, not code: this file is read with tomllib and nothing in it is executed.
# Copy it next to your own catalogs to use it as a starting point - change the
# [catalog] id if you do, or the copy will refuse to load beside this one.
#
# Nominal values, not datasheets. Every number here is a reasonable default for
# a first pass; a board you are going to build is characterised by its own
# laminate's numbers, from the fabricator who will make it.

schema = 1

[catalog]
id = "generic"
name = "Generic"
version = "2026-07-30"
description = "Common substrates and conductors at nominal values. Starting points for a first pass, not a substitute for your fabricator's datasheet."

# --- substrates -------------------------------------------------------------

[[material]]
id = "air"
name = "Air"
kind = "dielectric"
epsilon_r = 1.0
color = "#E6E6FF"
description = "Vacuum / air reference."

[[material]]
id = "fr4"
name = "FR4"
kind = "dielectric"
epsilon_r = 4.3
loss_tangent = 0.025
measured_at = 1.0e9
color = "#218B22"
description = "Nominal epoxy-glass laminate. FR4 is a flammability class, not a specification: permittivity spreads roughly 4.1 to 4.7 with weave and resin content, and falls with frequency."

[[material]]
id = "pvc"
name = "PVC"
kind = "dielectric"
epsilon_r = 2.9
loss_tangent = 0.008
measured_at = 1.0e6
color = "#D8D8C0"
description = "Rigid polyvinyl chloride. An enclosure and cable-jacket material rather than a microwave substrate, poorly characterised above a few hundred MHz."

[[material]]
id = "ptfe"
name = "PTFE"
kind = "dielectric"
epsilon_r = 2.1
loss_tangent = 0.0002
measured_at = 1.0e10
color = "#FFFFFF"
description = "Unfilled polytetrafluoroethylene (Teflon)."

[[material]]
id = "alumina-996"
name = "Alumina 99.6%"
kind = "dielectric"
epsilon_r = 9.8
loss_tangent = 0.0001
measured_at = 1.0e10
color = "#E6E6E6"
description = "99.6% Al2O3 ceramic substrate."

# --- conductors -------------------------------------------------------------
#
# A conductor drawn as a solid but modelled as a sheet is the usual case: in
# FDTD a trace is a surface, and the thickness below is a loss parameter feeding
# the surface impedance rather than geometry that reaches the grid.

[[material]]
id = "copper"
name = "Copper, 1 oz"
kind = "conducting_sheet"
conductivity = 5.8e7
thickness = 0.035
color = "#B87333"
description = "Annealed copper foil."

[[material]]
id = "copper-half-oz"
name = "Copper, 0.5 oz"
kind = "conducting_sheet"
conductivity = 5.8e7
thickness = 0.018
color = "#B87333"
description = "Annealed copper foil, the usual inner-layer weight."

[[material]]
id = "brass"
name = "Brass"
kind = "conducting_sheet"
conductivity = 1.57e7
thickness = 0.5
color = "#C8A951"
description = "CuZn37. Waveguide and enclosure walls."

[[material]]
id = "aluminium"
name = "Aluminium 6061"
kind = "conducting_sheet"
conductivity = 2.5e7
thickness = 1.0
color = "#A8A8A8"
description = "Enclosures and machined cavities."

[[material]]
id = "copper-pec"
name = "Copper (perfect)"
kind = "pec"
color = "#B87333"
description = "Lossless idealisation of copper."

[[material]]
id = "aluminium-pec"
name = "Aluminium (perfect)"
kind = "pec"
color = "#A8A8A8"
description = "Lossless idealisation of aluminium."
