# The fast suite, on every push.
#
# It needs neither FreeCAD nor openEMS. That is the point of the layering rule,
# and test_the_freecad_side_imports_neither_engine_nor_cad enforces it in a
# clean interpreter.
#
# It does need scipy, pandas and typing_extensions, which nothing here imports:
# vendored scikit-rf's package `__init__` pulls in `networkSet` and `circuit`,
# which want them. FreeCAD 1.1.1 ships all three (measured: scipy 1.16.3, pandas
# 2.3.3), which is why vendoring skrf works at all - so this line installs what
# FreeCAD happens to bundle, and a re-vendor has to re-measure it.
#
# The install line below is one of two statements of that list; `pyproject.toml`
# is the other, and `tests/test_declared_dependencies.py` fails if they differ.
# Edit one and you edit both. Nothing derives either from the code, because a
# dependency that arrives through the vendored library cannot be found by
# grepping for `import`.
#
# The list is a requirement and not a precaution: install `numpy pytest` alone
# and much of the suite fails, one library revealed at a time.
#
# The real solves are marked `slow` and are NOT run here, on any schedule. They
# need the openEMS bindings, which mean building openEMS and CSXCAD on the
# runner; until someone does that work, the four physics gates run locally only
# and this file cannot vouch for them. Do not read a green tick as "the numbers
# are still right" - it means the adapter is still self-consistent.
#
# The nightly run is not for the code, which has not changed since the last push.
# It is for everything underneath: the libraries float, so `pip install numpy
# pytest` resolves afresh, and a nightly failure is upstream drift rather than a
# regression.
#
# So what this file installs is of two kinds. A library the workbench *runs
# against* floats, which is what the nightly is for: finding out when numpy
# moves is the point. A tool that only *judges* the tree is pinned, because its
# output is a gate and an unpinned gate moves under a tree nobody has touched -
# a red build that says nothing about the code, on somebody else's release
# schedule. Which side a package is on is read off `pyproject.toml`, where the
# libraries and the tools are already declared apart, and
# `tests/test_declared_dependencies.py` holds every install line here to it.

name: tests

on:
  push:
  pull_request:
  schedule:
    # 03:17 UTC. Off the hour because every other cron in the world is on it.
    - cron: "17 3 * * *"

jobs:
  fast:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor `pyproject.toml` declares, and that file says
        # why; 3.13 is what development runs. The workbench has to work on
        # both, and the two ends moving together cover what is between them.
        # `tests/test_declared_dependencies.py` fails if this list's low end
        # and that declaration differ.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy scipy pandas typing_extensions pytest
      - name: Fast suite
        run: python -m pytest -q -m "not slow"

  lint:
    # Style, not correctness. The config, including the rules that are ignored
    # and why, is in pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned, for the reason the header gives, and both halves of this job
      # need it: a rule arrives and the tree it was written against goes red,
      # and the formatter reflows files nobody has touched. Moving the pin is
      # then a change somebody makes and reads the diff of. The same version is
      # in pyproject.toml, so what a contributor runs is what this runs.
      - run: pip install "ruff==0.15.22"
      - run: ruff check .
      - run: ruff format --check .

  types:
    # The counterpart to `lint`: ruff says how the code is written, mypy says
    # whether it agrees with itself. The configuration, including which layers
    # are held to what and why, is in pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # numpy is named because mypy does not bring it. Without it this job
      # goes red, one import error per module that imports it - loudly, and for
      # a reason that reads like a broken environment rather than a check that
      # has stopped happening. Nothing else is installed, because FreeCAD, its
      # Gui and the engine's bindings are unresolvable by design and
      # pyproject.toml declares them so - which makes this job the one place
      # that list is exercised against an environment that genuinely has none
      # of them.
      #
      # Pinned, as the linter is and for the same reason: what a checker
      # reports is its own release's opinion. numpy stays unpinned here even
      # though the job would be steadier with it fixed - it is a library the
      # workbench runs against, and the point of the nightly run is to find out
      # when it moves.
      - run: pip install "mypy==2.3.1" numpy
      - run: mypy

  imports-stay-clean:
    # Separate job on a deliberately bare environment. The suite asks the same
    # question of the same modules, but against a list of what may not be
    # imported, because the machine a test runs on has the runner's own
    # dependencies installed. This job installs numpy and nothing else, so a
    # module reaching for anything else fails here whether or not it is on that
    # list.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - name: Every adapter module imports without FreeCAD or openEMS
        # The module list is `tests/import_sweep.py`, which the suite reads as
        # well, so this job and the suite cannot come to sweep different sets.
        # Stating it here as well would be two lists, and the one that goes
        # stale is this one: `preflight` is a package, so a glob written for
        # files skips it while every other module goes on being swept.
        # This job installs nothing but numpy, so the script imports only the
        # standard library.
        run: python -m tests.import_sweep
